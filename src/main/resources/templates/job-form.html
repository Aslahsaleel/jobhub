<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Post Job</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="card"><h2>Post a Job</h2><form th:action="@{/employer/jobs}" th:object="${job}" method="post"><input th:field="*{title}" placeholder="Job title" required><input th:field="*{company}" placeholder="Company" required><input th:field="*{location}" placeholder="Location" required><input th:field="*{skills}" placeholder="Skills (Java, Spring Boot...)" required><input th:field="*{deadline}" type="date" required><textarea th:field="*{description}" placeholder="Job description" required></textarea><button>Publish</button></form><a href="/employer/jobs">Cancel</a></div></body></html>
