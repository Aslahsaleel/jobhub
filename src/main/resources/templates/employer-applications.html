<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Applications</title><link rel="stylesheet" href="/css/style.css"></head><body><nav><b>JobHub</b><a href="/employer/jobs">My Jobs</a></nav><main><h2>Candidate Applications</h2><table><tr><th>Candidate</th><th>Job</th><th>Status</th><th>Action</th></tr><tr th:each="a:${applications}"><td th:text="${a.applicant.name}"></td><td th:text="${a.job.title}"></td><td th:text="${a.status}"></td><td><form method="post" th:action="@{/employer/applications/{id}/status(id=${a.id})}"><select name="status"><option th:each="s:${statuses}" th:value="${s}" th:text="${s}" th:selected="${s==a.status}"></option></select><button>Update</button></form></td></tr></table></main></body></html>
