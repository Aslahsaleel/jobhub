<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Employer Dashboard</title><link rel="stylesheet" href="/css/style.css"></head><body><nav><b>JobHub</b><span><a href="/employer/applications">Applications</a> <a href="/employer/jobs/new">Post Job</a> <a href="/profile">Profile</a> <form class="inline" method="post" th:action="@{/logout}"><button>Logout</button></form></span></nav><main><h2>My Jobs</h2><div class="grid"><div class="card" th:each="j:${jobs}"><span class="badge" th:text="${j.active ? 'OPEN':'CLOSED'}"></span><h3 th:text="${j.title}"></h3><p th:text="${j.company+' · '+j.location}"></p><p th:text="${j.skills}"></p><small th:text="${'Deadline: '+j.deadline}"></small><form method="post" th:if="${j.active}" th:action="@{/employer/jobs/{id}/delete(id=${j.id})}"><button class="danger">Close Job</button></form></div></div></main></body></html>
