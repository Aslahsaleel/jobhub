<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${job.title+' | JobHub'}">Job</title><link rel="stylesheet" href="/css/style.css"></head><body><header class="topbar"><a class="brand" href="/dashboard">job<span>hub</span></a><nav class="navlinks"><a href="/applicant/jobs">Find Jobs</a><a href="/applicant/applications">My Applications</a><a href="/profile">Profile</a></nav></header><main class="page"><a href="/applicant/jobs" class="small">← Back to jobs</a><div class="layout" style="margin-top:16px"><section class="card"><div class="job-head"><div class="logo" th:text="${#strings.substring(job.company,0,1).toUpperCase()}">C</div><div><h1 style="margin:0 0 5px" th:text="${job.title}"></h1><div class="company" th:text="${job.company+' · '+job.location}"></div></div></div><hr><div class="meta"><span>◷ <b th:text="${job.employmentType}"></b></span><span th:if="${job.minSalary != null}">₹ <b th:text="${job.minSalary+' - '+job.maxSalary}"></b></span><span>Deadline <b th:text="${job.deadline}"></b></span></div><h3>Job description</h3><p th:text="${job.description}"></p><h3>Skills</h3><div class="skills"><span class="chip" th:each="s:${#strings.arraySplit(job.skills,',')}" th:text="${#strings.trim(s)}"></span></div></section><aside class="card" style="height:max-content"><h2>Apply for this job</h2><p class="small">Make your application stand out with a short cover note.</p><form method="post" th:action="@{/applicant/jobs/{id}/apply(id=${job.id})}" th:object="${application}"><textarea th:field="*{coverLetter}" placeholder="Tell the employer why you're a good fit..."></textarea><button class="btn btn-dark" style="width:100%">Apply now</button></form></aside></div></main></body></html>
