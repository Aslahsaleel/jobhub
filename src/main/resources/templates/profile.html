<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Profile | JobHub</title><link rel="stylesheet" href="/css/style.css"></head><body><nav><b>JobHub</b><a href="/dashboard">Dashboard</a><form class="inline" method="post" th:action="@{/logout}"><button>Logout</button></form></nav><main><div class="card"><h2>My Profile</h2><p th:if="${param.saved}" class="success">Profile updated.</p><p th:if="${param.uploaded}" class="success">Resume uploaded.</p><p th:if="${param.error}" class="error" th:text="${param.error}"></p><form th:action="@{/profile}" th:object="${user}" method="post"><input th:field="*{name}" placeholder="Full name" required><input th:field="*{phone}" placeholder="Phone"><input th:field="*{headline}" placeholder="Professional headline"><button>Save profile</button></form><hr><h3>Resume</h3><p th:if="${user.resumeFileName != null}" class="success">Resume uploaded successfully.</p><form method="post" th:action="@{/profile/resume}" enctype="multipart/form-data"><input type="file" name="resume" accept="application/pdf" required><button>Upload PDF</button></form></div></main></body></html>
