<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Applications</title><link rel="stylesheet" href="/css/style.css"></head><body><nav><b>JobHub</b><a href="/applicant/jobs">Browse Jobs</a></nav><main><h2>My Applications</h2><table><tr><th>Job</th><th>Company</th><th>Status</th><th>Applied</th></tr><tr th:each="a:${applications}"><td th:text="${a.job.title}"></td><td th:text="${a.job.company}"></td><td><span class="badge" th:text="${a.status}"></span></td><td th:text="${a.appliedAt}"></td></tr></table></main></body></html>
